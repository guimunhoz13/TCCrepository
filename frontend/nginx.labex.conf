server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A exportação estática não aplica os cabeçalhos do servidor Next.js.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data: http://127.0.0.1:8000; connect-src 'self' http://127.0.0.1:8000 https://viacep.com.br https://brasilapi.com.br; frame-src 'self' blob: http://127.0.0.1:8000; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # O export cria dashboard.html para a rota /dashboard, por exemplo.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        # add_header neste bloco substitui os cabeçalhos herdados do server.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data: http://127.0.0.1:8000; connect-src 'self' http://127.0.0.1:8000 https://viacep.com.br https://brasilapi.com.br; frame-src 'self' blob: http://127.0.0.1:8000; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "public, immutable";
    }
}
