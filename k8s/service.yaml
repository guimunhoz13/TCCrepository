apiVersion: v1
kind: Service
metadata:
  name: lexnexo-frontend-service
  namespace: lexnexo-lab
  labels:
    app.kubernetes.io/name: lexnexo-frontend
    app.kubernetes.io/part-of: lexnexo-kubernetes-lab
spec:
  type: NodePort
  selector:
    app: lexnexo-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30080
