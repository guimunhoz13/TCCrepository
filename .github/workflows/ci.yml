name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    # O projeto usa Postgres (Supabase) em produção/dev. O CI não se
    # conecta ao Supabase real — sobe um Postgres efêmero equivalente,
    # só para os testes, sem tocar no banco compartilhado da dupla.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      # Sem DEBUG=True o settings exige uma SECRET_KEY real; esta só existe
      # no CI, para o `check` subir o projeto como subiria em produção.
      SECRET_KEY: chave-exclusiva-do-ci-nao-usada-em-producao-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python manage.py test

      # Django não gera um artefato "compilado" como outras stacks — o
      # equivalente ao build é validar que o projeto está íntegro e pronto
      # para rodar (settings, apps, models e URLs sem erros).
      - name: Build (django check)
        working-directory: backend
        run: python manage.py check

      # Gera o arquivo OpenAPI e falha se o esquema tiver erro ou aviso
      # (rota sem documentação, campo de tipo desconhecido).
      - name: Documentação da API (OpenAPI)
        working-directory: backend
        run: python manage.py spectacular --validate --fail-on-warn --file openapi.yml

      - name: Publicar o openapi.yml
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.yml

      # Simula a configuração de produção (DEBUG desligado, HTTPS) e falha se
      # o Django apontar qualquer aviso de segurança de deploy.
      - name: Checagem de segurança de produção (check --deploy)
        working-directory: backend
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: lexoffice.exemplo.com
        run: python manage.py check --deploy --fail-level WARNING

      # Aponta dependências Python com vulnerabilidades conhecidas. Não
      # quebra o build (continue-on-error) — serve como alerta a ser
      # avaliado manualmente, não como gate automático.
      - name: Dependency audit (pip-audit)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: Run tests
        working-directory: frontend
        run: npm test -- --ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # Aponta dependências npm com vulnerabilidades conhecidas de
      # severidade alta/crítica. Não quebra o build (continue-on-error) —
      # serve como alerta a ser avaliado manualmente, não como gate
      # automático.
      - name: Dependency audit (npm audit)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    # O sistema inteiro de pé — Postgres, API Django e front Next.js de
    # produção — e um navegador de verdade usando, sobre o escritório criado
    # por `popular_demo`. Inclui checagem de acessibilidade (axe, WCAG AA).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DEBUG: "True"
      # Os testes entram e saem dezenas de vezes por minuto.
      LIMITES_DESLIGADOS: "True"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Back-end — dependências, banco e dados de demonstração
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py popular_demo

      - name: Back-end — subir a API
        working-directory: backend
        run: nohup python manage.py runserver 127.0.0.1:8000 --noreload > ../backend.log 2>&1 &

      - name: Front-end — dependências, build e servidor
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run start -- -p 3000 > ../frontend.log 2>&1 &

      - name: Navegador do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Esperar API e front responderem
        run: |
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8000/api/schema/ && curl -s -o /dev/null http://localhost:3000/login && exit 0
            sleep 2
          done
          echo "Servidores não subiram"; cat backend.log frontend.log; exit 1

      - name: Testes de ponta a ponta
        working-directory: frontend
        run: npm run e2e

      - name: Relatório do Playwright e logs (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-relatorio
          path: |
            frontend/playwright-report
            frontend/test-results
            backend.log
            frontend.log
