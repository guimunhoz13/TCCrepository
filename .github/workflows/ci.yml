name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    # O projeto usa Postgres (Supabase) em produção/dev. O CI não se
    # conecta ao Supabase real — sobe um Postgres efêmero equivalente,
    # só para os testes, sem tocar no banco compartilhado da dupla.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      # Sem DEBUG=True o settings exige uma SECRET_KEY real; esta só existe
      # no CI, para o `check` subir o projeto como subiria em produção.
      SECRET_KEY: chave-exclusiva-do-ci-nao-usada-em-producao-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python manage.py test

      # Django não gera um artefato "compilado" como outras stacks — o
      # equivalente ao build é validar que o projeto está íntegro e pronto
      # para rodar (settings, apps, models e URLs sem erros).
      - name: Build (django check)
        working-directory: backend
        run: python manage.py check

      # Simula a configuração de produção (DEBUG desligado, HTTPS) e falha se
      # o Django apontar qualquer aviso de segurança de deploy.
      - name: Checagem de segurança de produção (check --deploy)
        working-directory: backend
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: lexoffice.exemplo.com
        run: python manage.py check --deploy --fail-level WARNING

      # Aponta dependências Python com vulnerabilidades conhecidas. Não
      # quebra o build (continue-on-error) — serve como alerta a ser
      # avaliado manualmente, não como gate automático.
      - name: Dependency audit (pip-audit)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: Run tests
        working-directory: frontend
        run: npm test -- --ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # Aponta dependências npm com vulnerabilidades conhecidas de
      # severidade alta/crítica. Não quebra o build (continue-on-error) —
      # serve como alerta a ser avaliado manualmente, não como gate
      # automático.
      - name: Dependency audit (npm audit)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high
